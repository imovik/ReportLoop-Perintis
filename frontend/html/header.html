<header class="app-header sticky top-0 z-30 safe-top">
  <div class="relative max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between gap-3 py-2 sm:py-3 lg:grid lg:grid-cols-[1fr_auto_1fr]">

      <a href="../index.html" class="flex items-center gap-2 sm:gap-2.5 rounded-lg min-w-0">
        <span class="w-8 h-8 sm:w-9 sm:h-9 rounded-lg bg-white/15 flex items-center justify-center shrink-0">
          <svg class="w-4 h-4 sm:w-5 sm:h-5" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
          </svg>
        </span>
        <div class="min-w-0">
          <p class="text-base sm:text-lg font-extrabold tracking-tight leading-none">ReportLoop</p>
          <p id="role-label" class="mt-0.5 sm:mt-1 text-[11px] sm:text-xs text-blue-100 truncate">Politeknik Negeri Indramayu</p>
        </div>
      </a>

      <!-- Menu desktop -->
      <nav aria-label="Navigasi utama" class="hidden lg:block">
        <ul id="app-nav" class="flex items-center justify-center gap-1.5"></ul>
      </nav>

      <div class="flex items-center justify-end gap-2">
        <!-- Tema terang/gelap: selalu terlihat di header, tidak masuk panel -->
        <button
          type="button"
          data-theme-toggle
          aria-pressed="false"
          aria-label="Beralih ke mode gelap"
          class="nav-link border border-white/35 px-2.5"
        >
          <span data-theme-icon class="shrink-0"></span>
          <span data-theme-label class="hidden xl:inline">Gelap</span>
        </button>

        <!-- Desktop: tombol avatar -->
        <button
          type="button"
          data-account-trigger
          aria-haspopup="true"
          aria-expanded="false"
          aria-controls="account-panel"
          aria-label="Buka menu akun"
          class="hidden lg:inline-flex nav-link border border-white/35"
        >
          <span data-session-avatar class="w-7 h-7 rounded-full bg-white/20 text-xs font-extrabold flex items-center justify-center uppercase overflow-hidden">U</span>
          <span data-session-name class="hidden xl:inline max-w-[140px] truncate">-</span>
        </button>

        <!-- HP: ikon garis tiga -->
        <button
          type="button"
          data-account-trigger
          aria-haspopup="true"
          aria-expanded="false"
          aria-controls="account-panel"
          aria-label="Buka menu"
          class="lg:hidden nav-link border border-white/35 px-2.5"
        >
          <svg class="w-5 h-5" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Panel akun: sheet di HP, dropdown di desktop -->
    <div id="account-backdrop" class="hidden fixed inset-0 z-40 bg-black/40 lg:bg-transparent" aria-hidden="true"></div>
    <div
      id="account-panel"
      role="menu"
      aria-label="Menu akun"
      class="hidden absolute z-50 right-3 sm:right-6 lg:right-8 top-full mt-2 w-[min(22rem,calc(100vw-1.5rem))] max-h-[calc(100dvh-5rem)] overflow-y-auto rounded-[14px] border border-ink-200 dark:border-ink-700 bg-ink-50 dark:bg-ink-900 text-ink-900 dark:text-white shadow-lg"
    >
      <div class="flex items-center gap-3 p-4 border-b border-ink-200 dark:border-ink-800">
        <span data-session-avatar class="w-12 h-12 rounded-full bg-brand-700 text-white text-base font-extrabold flex items-center justify-center uppercase overflow-hidden shrink-0">U</span>
        <div class="min-w-0">
          <p data-session-name class="font-extrabold truncate">-</p>
          <p data-session-role class="text-xs text-ink-600 dark:text-ink-300 truncate">Mahasiswa</p>
          <p data-session-id class="text-xs font-mono text-ink-600 dark:text-ink-300 truncate">-</p>
        </div>
      </div>

      <ul id="panel-nav" class="lg:hidden p-2 border-b border-ink-200 dark:border-ink-800" aria-label="Navigasi utama"></ul>

      <div class="p-2">
        <button type="button" role="menuitem" data-nav-view="profil" class="menu-item">
          <svg class="w-5 h-5 shrink-0" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
          </svg>
          <span>Profil &amp; Pengaturan Akun</span>
        </button>

        <button id="btn-api-mode" type="button" role="menuitem" aria-describedby="api-mode-hint" class="menu-item">
          <span id="api-dot" aria-hidden="true" class="w-2.5 h-2.5 rounded-full bg-amber-300 shrink-0"></span>
          <span class="flex-1 text-left">Mode data: <span id="api-mode-label">Mode demo</span></span>
        </button>
        <span id="api-mode-hint" class="sr-only">Tekan untuk beralih antara data demo di browser dan server FastAPI lokal.</span>

      </div>

      <div class="p-2 border-t border-ink-200 dark:border-ink-800">
        <button type="button" role="menuitem" data-logout-trigger class="menu-item menu-item-danger">
          <svg class="w-5 h-5 shrink-0" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
          </svg>
          <span>Keluar</span>
        </button>
      </div>
    </div>
  </div>
</header>

<div id="toast-container" role="status" aria-live="polite" class="fixed bottom-4 left-3 right-3 sm:left-auto sm:bottom-5 sm:right-5 z-50 flex flex-col gap-2 sm:max-w-sm sm:w-full pointer-events-none safe-bottom"></div>
